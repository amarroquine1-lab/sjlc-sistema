# SOLO PRUEBAS (scripts/probar-ip-real.sh): hace que Nginx trate a las redes privadas de Docker
# como si fueran Cloudflare, para comprobar que usa CF-Connecting-IP como IP del cliente.
# No forma parte de la imagen ni se usa en desarrollo ni en producción.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
