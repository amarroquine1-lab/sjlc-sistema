add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

root /usr/share/nginx/html;
index index.html;

location = /nginx-salud {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location /api/ {
    limit_req zone=api burst=120 nodelay;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # Las cabeceras de seguridad las pone Nginx; se ocultan las del backend para no duplicarlas
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
}

location /assets/ {
    expires 30d;
    try_files $uri =404;
}

location / {
    try_files $uri /index.html;
}
