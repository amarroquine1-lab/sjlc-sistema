# Producción: solo se aceptan conexiones que vienen de Cloudflare
include /etc/nginx/cloudflare/acceso.conf;

server {
    listen 8080;
    server_name _;

    # Salud interna del contenedor (127.0.0.1 está permitido por la lista)
    location = /nginx-salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        if ($desde_cloudflare = 0) { return 444; }
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certificados/origen.pem;
    ssl_certificate_key /etc/nginx/certificados/origen.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($desde_cloudflare = 0) { return 444; }

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/aplicacion.conf;
}
