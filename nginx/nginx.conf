worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/cuerpo;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    # Sin querystring: la búsqueda de pacientes puede llevar DPI, nombres o fechas de nacimiento
    log_format principal '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout principal;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # IP real del visitante: Cloudflare la envía en CF-Connecting-IP
    include /etc/nginx/cloudflare/ip-real.conf;

    # Todo el centro sale por una sola IP pública: el límite por IP debe dejar pasar a unas 20 sesiones activas
    # (medido en la prueba de carga). Los límites finos por sesión y por intentos de ingreso los aplica el backend.
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

    include /tmp/sitio.conf;
}
